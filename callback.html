 <!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Goldeneye OAuth - Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        // Extract authorization code from URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const error = urlParams.get('error');
        
        if (error) {
            // OAuth error from Schwab
            document.addEventListener('DOMContentLoaded', function() {
                document.body.innerHTML = `
                    <div class="container">
                        <h1>❌ Authorization Failed</h1>
                        <p>Error: ${error}</p>
                        <p>${urlParams.get('error_description') || ''}</p>
                    </div>
                `;
            });
        } else if (code) {
            // Success - redirect to app with custom URL scheme
            const appUrl = `goldeneye://oauth/callback?code=${encodeURIComponent(code)}${state ? '&state=' + encodeURIComponent(state) : ''}`;
            
            // Immediate redirect
            window.location.href = appUrl;
            
            // Fallback message if redirect doesn't work
            setTimeout(function() {
                document.addEventListener('DOMContentLoaded', function() {
                    document.body.innerHTML = `
                        <div class="container">
                            <h1>✅ Authorization Successful</h1>
                            <p>Please return to the Goldeneye app.</p>
                            <p style="font-size: 0.9em; opacity: 0.8; margin-top: 20px;">
                                If the app didn't open automatically, please open it manually.
                            </p>
                        </div>
                    `;
                });
            }, 500);
        } else {
            // No code or error - shouldn't happen
            document.addEventListener('DOMContentLoaded', function() {
                document.body.innerHTML = `
                    <div class="container">
                        <h1>⚠️ Invalid Callback</h1>
                        <p>No authorization code received.</p>
                    </div>
                `;
            });
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Redirecting to Goldeneye...</h1>
        <p>Please wait a moment.</p>
    </div>
</body>
</html>
