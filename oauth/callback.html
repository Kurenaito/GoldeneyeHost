<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Goldeneye OAuth - Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>
    <div class="container" id="content">
        <div class="spinner"></div>
        <h1>Redirecting to Goldeneye...</h1>
        <p>Please wait a moment.</p>
    </div>

    <script>
        // Extract authorization code from URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const error = urlParams.get('error');
        
        const contentDiv = document.getElementById('content');
        
        if (error) {
            // OAuth error from Schwab
            contentDiv.innerHTML = `
                <h1 class="error">❌ Authorization Failed</h1>
                <p>Error: ${error}</p>
                <p>${urlParams.get('error_description') || ''}</p>
            `;
        } else if (code) {
            // Success - show redirecting message
            contentDiv.innerHTML = `
                <div class="spinner"></div>
                <h1 class="success">✅ Authorization Successful</h1>
                <p>Redirecting to Goldeneye app...</p>
                <p style="font-size: 0.9em; opacity: 0.8; margin-top: 20px;">
                    Code received: ${code.substring(0, 10)}...
                </p>
            `;
            
            // Build app URL with custom scheme
            const appUrl = `goldeneye://oauth/callback?code=${encodeURIComponent(code)}${state ? '&state=' + encodeURIComponent(state) : ''}`;
            
            // Redirect after brief delay (so user sees success message)
            setTimeout(function() {
                window.location.href = appUrl;
                
                // Show fallback message after redirect attempt
                setTimeout(function() {
                    contentDiv.innerHTML = `
                        <h1 class="success">✅ Authorization Complete</h1>
                        <p>Please return to the Goldeneye app.</p>
                        <p style="font-size: 0.9em; opacity: 0.8; margin-top: 20px;">
                            If the app didn't open automatically, please open it manually.
                        </p>
                    `;
                }, 1000);
            }, 500);
        } else {
            // No code or error
            contentDiv.innerHTML = `
                <h1 class="error">⚠️ Invalid Callback</h1>
                <p>No authorization code received.</p>
                <p style="font-size: 0.8em; opacity: 0.7;">
                    Current URL: ${window.location.href}
                </p>
            `;
        }
    </script>
</body>
</html>
